body{

  background-image:
    radial-gradient(120% 60% at 50% -10%,#17553B 0%,rgba(23,85,59,0) 60%),

const CREAM="#F7EFD8",PAPER="#FDF8EC",FOREST="#0E3B2A",LEAF="#1B6B43",
      PINK="#E51A5A",SUN="#FFC72C",INK="#0B2A1E";

const CLASSES=["TERMINAL WIZARD","SHIP GOBLIN","LATE NIGHT ARCHITECT","BUG WHISPERER","PIXEL PIRATE",
  "COMMIT MACHINE","PROMPT SMUGGLER","LATENCY HUNTER","EDGE CASE MONK","DEMO DAY DAREDEVIL",

// ── Hash helpers — MUST match framein-goa.html exactly ──────────────
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function combinedHash(n,r,s){return hash((n||"builder")+"|"+(r||"")+"|"+(s||""))}
function autoClass(n,r,s){return CLASSES[combinedHash(n,r,s)%CLASSES.length]}
function builderId(n,r,s){return "#HH-GOA-"+String(1+combinedHash(n,r,s)%247).padStart(3,"0")}

let cv,ctx;

// ── Canvas helpers ───────────────────────────────────────────────────
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,font,color,align="center",spacing=0){
  ctx.save();ctx.font=font;ctx.fillStyle=color;ctx.textAlign=spacing?"left":align;ctx.textBaseline="middle";
  if(!spacing){ctx.fillText(s,x,y);ctx.restore();return}
  let w=0;for(const ch of s)w+=ctx.measureText(ch).width+spacing;w-=spacing;
  let cx2=align==="center"?x-w/2:align==="right"?x-w:x;
  for(const ch of s){ctx.fillText(ch,cx2,y);cx2+=ctx.measureText(ch).width+spacing}
  ctx.restore();
}
function fitTxt(s,x,y,maxW,base,font,color,spacing=0){
  let size=base;
  for(;;){const f=font.replace("__",size+"px");ctx.font=f;
    let w=0;for(const ch of s)w+=ctx.measureText(ch).width+spacing;
    if(w-spacing<=maxW||size<14){txt(s,x,y,f,color,"center",spacing);return}
    size-=2;}
}
function frond(bx,by,ang,len,curve,cA,cB){
  const ex=bx+Math.cos(ang)*len,ey=by+Math.sin(ang)*len;
  const nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);
  const cxp=bx+Math.cos(ang)*len*.55+nx*curve,cyp=by+Math.sin(ang)*len*.55+ny*curve;
  const pt=t=>{const u=1-t;return[u*u*bx+2*u*t*cxp+t*t*ex,u*u*by+2*u*t*cyp+t*t*ey]};
  const N=17;
  for(let i=1;i<=N;i++){
    const t=i/N,[px,py]=pt(t),[qx,qy]=pt(Math.max(0,t-1/N));
    let dx=px-qx,dy=py-qy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const px2=-dy,py2=dx;
    const prof=Math.sin(Math.pow(t,.72)*Math.PI)*(1-t*.28);
    const L=len*.30*prof,sweep=len*.13*prof;
    if(L<1)continue;
    for(const side of[1,-1]){
      ctx.fillStyle=(i%2?cA:cB);ctx.beginPath();ctx.moveTo(px,py);
      ctx.quadraticCurveTo(px+px2*side*L*.55+dx*sweep*.3,py+py2*side*L*.55+dy*sweep*.3,px+px2*side*L+dx*sweep,py+py2*side*L+dy*sweep);
      ctx.quadraticCurveTo(px+px2*side*L*.42+dx*sweep*1.05,py+py2*side*L*.42+dy*sweep*1.05,px+dx*len*.055,py+dy*len*.055);
      ctx.closePath();ctx.fill();
    }
  }
  ctx.strokeStyle=cA;ctx.lineWidth=Math.max(1.6,len*.022);ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(cxp,cyp,ex,ey);ctx.stroke();
}

function palm(x,y,s,flip){
  ctx.save();ctx.translate(x,y);ctx.scale(flip?-s:s,s);
  const G1="#1B6B43",G2="#0E3B2A",BARK="#8A5A2B",BARK2="#6B431E";
  const H=132,LEAN=22,tip=[LEAN,-H],baseW=13,tipW=5,cxp=-14,cyp=-H*.55;
  const at=t=>{const u=1-t;return[u*u*0+2*u*t*cxp+t*t*tip[0],u*u*0+2*u*t*cyp+t*t*tip[1]]};
  ctx.beginPath();
  for(let i=0;i<=20;i++){const t=i/20,[px,py]=at(t);const w=baseW+(tipW-baseW)*t;if(i===0)ctx.moveTo(px-w,py);else ctx.lineTo(px-w,py)}
  for(let i=20;i>=0;i--){const t=i/20,[px,py]=at(t);const w=baseW+(tipW-baseW)*t;ctx.lineTo(px+w,py)}
  ctx.closePath();ctx.fillStyle=BARK;ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle=BARK2;ctx.lineWidth=2.4;
  for(let i=1;i<19;i++){const t=i/20,[px,py]=at(t);ctx.beginPath();ctx.moveTo(px-16,py+3);ctx.quadraticCurveTo(px,py-3,px+16,py+3);ctx.stroke()}
  ctx.restore();
  const set=[[-1.95,74,26],[-1.40,84,30],[-0.85,80,22],[-2.55,80,-26],[-3.05,74,-30],[-0.30,64,16],[-3.55,62,-18]];
  set.forEach(f=>frond(tip[0],tip[1]+2,f[0],f[1],f[2],G1,G2));
  ctx.fillStyle="#5E3B18";
  [[-9,-H+9],[9,-H+11],[0,-H+18]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],6.2,0,7);ctx.fill()});
  ctx.fillStyle="rgba(255,255,255,.22)";
  [[-11,-H+7],[7,-H+9]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.1,0,7);ctx.fill()});
  ctx.strokeStyle=G1;ctx.lineWidth=4;ctx.lineCap="round";
  [[-26,-10],[-16,-16],[18,-14],[28,-8]].forEach(p=>{ctx.beginPath();ctx.moveTo(0,2);ctx.quadraticCurveTo(p[0]*.6,p[1]*1.4,p[0],p[1]);ctx.stroke()});
  ctx.restore();
}
function sunRays(x,y,r,c1,c2){
  ctx.save();ctx.fillStyle=c2;
  for(let i=0;i<14;i++){const a=i*Math.PI/7;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r*1.55,a,a+.13);ctx.fill()}
  ctx.fillStyle=c1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
}
function waves(x,y,w,c,n=3){
  ctx.save();ctx.strokeStyle=c;ctx.lineWidth=4;ctx.lineCap="round";
  for(let j=0;j<n;j++){ctx.beginPath();for(let i=0;i<=w;i+=6)ctx.lineTo(x+i,y+j*13+Math.sin(i/13)*4);ctx.stroke()}
  ctx.restore();
}
function barcode(x,y,w,h,seed){
  ctx.save();ctx.fillStyle=INK;let p=x,s=seed;
  while(p<x+w){s=(s*1103515245+12345)>>>0;const bw=2+(s>>16)%7;if((s>>8)%3)ctx.fillRect(p,y,bw,h);p+=bw+3}
  ctx.restore();
}
function ribbon(cx,y,w,h,label){
  ctx.save();ctx.fillStyle=PINK;
  ctx.beginPath();ctx.moveTo(cx-w/2,y);ctx.lineTo(cx+w/2,y);ctx.lineTo(cx+w/2-22,y+h/2);ctx.lineTo(cx+w/2,y+h);
  ctx.lineTo(cx-w/2,y+h);ctx.lineTo(cx-w/2+22,y+h/2);ctx.closePath();ctx.fill();
  txt(label,cx,y+h/2+1,"700 30px 'Space Grotesk'",PAPER,"center",3);
  ctx.restore();
}
function makeQRCanvas(text,x,y,size,darkColor,lightColor){
  const qr=qrcode(0,'M');qr.addData(text);qr.make();
  const N=qr.getModuleCount(),cell=size/N;
  ctx.save();
  ctx.fillStyle=lightColor||"#ffffff";ctx.fillRect(x-cell*2,y-cell*2,size+cell*4,size+cell*4);
  ctx.fillStyle=darkColor||FOREST;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(qr.isDark(r,c))ctx.fillRect(x+c*cell,y+r*cell,cell,cell);
  ctx.restore();
}

// ── Photo slot: uses stored base64, falls back to initials ───────────
function drawPhotoSlot(pxx,pyy,pw,ph,name,photoImg){
  ctx.save();rr(pxx,pyy,pw,ph,26);ctx.clip();
  if(photoImg){
    const s=Math.max(pw/photoImg.width,ph/photoImg.height);
    const w=photoImg.width*s,h=photoImg.height*s;
    ctx.drawImage(photoImg,pxx+pw/2-w/2,pyy+ph/2-h/2,w,h);
  } else {
    const grad=ctx.createLinearGradient(pxx,pyy,pxx+pw,pyy+ph);
    grad.addColorStop(0,LEAF);grad.addColorStop(1,FOREST);
    ctx.fillStyle=grad;ctx.fillRect(pxx,pyy,pw,ph);
    const parts=name.trim().split(/\s+/);
    const ini=(parts[0]?.[0]||"")+(parts[1]?.[0]||"");
    const fontSize=Math.round(pw*0.38);
    ctx.font=`700 ${fontSize}px 'Bebas Neue'`;
    ctx.fillStyle="rgba(247,239,216,.9)";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(ini.toUpperCase(),pxx+pw/2,pyy+ph/2);
  }
  ctx.restore();
}

// ── Main card draw — pixel-perfect match to framein-goa drawID ───────
function drawVerifyID(b, photoImg){
  const W=1040,H=1500;
  cv.width=W;cv.height=H;

  // Pull data from Supabase record
  const name   = (b.name||"YOUR NAME").toUpperCase();
  const role   = (b.role||"BUILDER").toUpperCase();
  const ship   = (b.shipping||"BUILDING THE FUTURE").toUpperCase();
  // Use stored builder_class if present, otherwise recompute with full hash
  const cls    = (b.builder_class||autoClass(name,role,ship)).toUpperCase();
  // Recompute bid from all three fields — matches generation logic
  const bid    = builderId(name,role,ship);
  const bidNum = bid.replace("#HH-GOA-","");

  ctx.clearRect(0,0,W,H);

  // ── Outer borders ──
  ctx.save();rr(14,14,W-28,H-28,64);ctx.fillStyle=FOREST;ctx.fill();ctx.restore();
  ctx.save();rr(30,30,W-60,H-60,54);ctx.fillStyle=SUN;ctx.fill();ctx.restore();
  ctx.save();rr(42,42,W-84,H-84,48);ctx.fillStyle=CREAM;ctx.fill();ctx.clip();

  // dot texture
  ctx.fillStyle="rgba(27,107,67,.05)";
  for(let y=60;y<H;y+=46)for(let x=60;x<W;x+=46){ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}

  // ── 1. HEADER — exact match to framein-goa drawID ──
  const hb=232;
  ctx.save();ctx.beginPath();ctx.moveTo(42,42);ctx.lineTo(W-42,42);ctx.lineTo(W-42,hb);
  ctx.quadraticCurveTo(W/2,hb+58,42,hb);ctx.closePath();ctx.fillStyle=FOREST;ctx.fill();ctx.restore();
  // lanyard slot
  ctx.save();rr(W/2-92,66,184,26,13);ctx.fillStyle=CREAM;ctx.fill();ctx.restore();

  // "HACKER HOUSE" in Bebas Neue + "गोवा" in Alfa Slab One (same as framein-goa h1)
  ctx.save();ctx.textBaseline="middle";ctx.textAlign="left";
  ctx.font="72px 'Bebas Neue'";
  const wa=ctx.measureText("HACKER HOUSE ").width;
  ctx.font="bold 68px 'Alfa Slab One', serif";
  const wb=ctx.measureText("गोवा").width;
  let sx=W/2-(wa+wb)/2;
  // "HACKER HOUSE " — Bebas Neue, cream
  ctx.font="72px 'Bebas Neue'";
  ctx.fillStyle=CREAM;
  ctx.fillText("HACKER HOUSE ",sx,152);sx+=wa;
  // "गोवा" — Alfa Slab One, sun yellow + pink hard shadow
  ctx.font="bold 68px 'Alfa Slab One', serif";
  ctx.fillStyle=PINK;ctx.fillText("गोवा",sx+3,152+3);
  ctx.fillStyle=SUN;ctx.fillText("गोवा",sx,152);
  ctx.restore();

  txt("GOA, INDIA · 28–31 OCT 2026",W/2,200,"700 20px 'Space Grotesk'",SUN,"center",4);

  // ── 2:47PM Studio logo — top RIGHT of header band (exact match to framein-goa drawID) ──
  if(_studioLogo.complete && _studioLogo.naturalWidth > 0){
    const logoW = 110, logoH = Math.round(logoW * (_studioLogo.naturalHeight / _studioLogo.naturalWidth));
    const lx = W - 42 - logoW - 14, ly = 58;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.drawImage(_studioLogo, lx, ly, logoW, logoH);
    ctx.restore();
  }

  // ── 2. PHOTO + META ──
  const pw=352,ph=422,pxx=88,pyy=316;
  sunRays(pxx+pw/2,pyy+ph/2,240,"rgba(255,246,223,.95)","rgba(255,199,44,.20)");
  ctx.save();rr(pxx-12,pyy-12,pw+24,ph+24,34);ctx.fillStyle=PAPER;ctx.fill();ctx.strokeStyle=FOREST;ctx.lineWidth=7;ctx.stroke();ctx.restore();
  drawPhotoSlot(pxx,pyy,pw,ph,name,photoImg);
  ctx.save();rr(pxx,pyy,pw,ph,26);ctx.strokeStyle=SUN;ctx.lineWidth=6;ctx.stroke();ctx.restore();

  const mx=486,mw=W-42-mx-46;
  const field=(fy,fh,label,value,valColor,size)=>{
    ctx.save();rr(mx,fy,mw,fh,20);ctx.fillStyle=PAPER;ctx.fill();
    ctx.strokeStyle="rgba(14,59,42,.35)";ctx.lineWidth=3;ctx.stroke();ctx.restore();
    txt(label,mx+22,fy+28,"700 15px 'Space Grotesk'",LEAF,"left",2.4);
    const lines=[];const words=value.split(" ");let cur="";
    ctx.font="700 "+size+"px 'Space Grotesk'";
    words.forEach(w=>{const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>mw-44&&cur){lines.push(cur);cur=w}else cur=t});
    lines.push(cur);
    const startY=fy+28+(fh-40-lines.length*(size+6))/2+size/2+10;
    lines.forEach((l,i)=>fitTxt(l,mx+mw/2,startY+i*(size+6),mw-44,size,"700 __ 'Space Grotesk'",valColor,1));
  };
  field(304,120,"NAME",name,FOREST,40);
  field(438,100,"STACK / ROLE",role,PINK,28);
  field(552,100,"BUILDER CLASS",cls,PINK,28);
  field(666,86,"BUILDER ID",bid,INK,26);

  // ── 3. SHIPPING STRIP ──
  ctx.save();rr(88,772,W-176,104,26);ctx.fillStyle=FOREST;ctx.fill();ctx.strokeStyle=SUN;ctx.lineWidth=5;ctx.stroke();ctx.restore();
  txt("✦ CURRENTLY SHIPPING ✦",W/2,806,"700 16px 'Space Grotesk'",SUN,"center",3);
  fitTxt(ship,W/2,846,W-260,34,"__ 'Bebas Neue'",PAPER,3);

  // ── 4. BEACH BAG ──
  txt("✦ BEACH BAG ✦",W/2,922,"700 14px 'DM Mono'",LEAF,"center",3);
  BAG.forEach((bg,i)=>{const bx=126+i*272;
    ctx.save();rr(bx,942,238,80,22);ctx.fillStyle="#FFF3CC";ctx.fill();ctx.strokeStyle=PINK;ctx.lineWidth=3;ctx.stroke();ctx.restore();
    txt(bg[0],bx+28,982,"26px serif",FOREST,"left");
    txt(bg[1],bx+72,982,"700 22px 'Bebas Neue'",FOREST,"left",3);
  });

  // ── 5. PERFORATION ──
  ctx.save();ctx.strokeStyle="rgba(14,59,42,.45)";ctx.lineWidth=4;ctx.setLineDash([12,14]);
  ctx.beginPath();ctx.moveTo(70,1064);ctx.lineTo(W-70,1064);ctx.stroke();ctx.restore();
  ctx.save();ctx.fillStyle=SUN;
  ctx.beginPath();ctx.arc(42,1064,26,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(W-42,1064,26,0,7);ctx.fill();ctx.restore();

  // ── 6. STUB: QR + barcode ──
  const sy=1074,qrFrame=176,qrPad=10;
  const qrCardX=72,qrCardY=sy+4,qrCardW=qrFrame+36,qrCardH=qrFrame+96;
  ctx.save();rr(qrCardX,qrCardY,qrCardW,qrCardH,20);ctx.fillStyle=PAPER;ctx.fill();ctx.strokeStyle=FOREST;ctx.lineWidth=4;ctx.stroke();ctx.restore();
  const innerX=qrCardX+(qrCardW-qrFrame)/2,innerY=qrCardY+14;
  ctx.save();rr(innerX,innerY,qrFrame,qrFrame,14);ctx.fillStyle="#FFFFFF";ctx.fill();ctx.strokeStyle=SUN;ctx.lineWidth=4;ctx.stroke();ctx.restore();
  const qrURL=VERIFY_URL+"?id="+bidNum;
  makeQRCanvas(qrURL,innerX+qrPad,innerY+qrPad,qrFrame-qrPad*2,FOREST,"#FFFFFF");
  txt("SCAN TO VERIFY",qrCardX+qrCardW/2,innerY+qrFrame+20,"700 13px 'DM Mono',monospace",LEAF,"center",2);
  txt(bid,qrCardX+qrCardW/2,innerY+qrFrame+44,"700 19px 'Bebas Neue'",FOREST,"center",3);

  const stubX=qrCardX+qrCardW+18,stubW=W-stubX-90;
  ctx.save();rr(stubX,sy,stubW,150,24);ctx.fillStyle=PAPER;ctx.fill();ctx.strokeStyle=FOREST;ctx.lineWidth=4;ctx.stroke();ctx.restore();
  txt("ADMIT ONE BUILDER",stubX+stubW/2,sy+42,"700 17px 'Space Grotesk'",LEAF,"center",3);
  fitTxt(name,stubX+stubW/2,sy+92,stubW-40,40,"__ 'Bebas Neue'",FOREST,3);
  const bcX=stubX+20,bcY=sy+160,bcW=stubW-40,bcH=52;
  barcode(bcX,bcY,bcW,bcH,hash(name)+13);
  txt("BUILD · SHIP · REPEAT",stubX+stubW/2,sy+248,"600 15px 'DM Mono',monospace",LEAF,"center",3);

  // ── 7. FOOTER ──
  ctx.save();ctx.fillStyle=LEAF;
  ctx.beginPath();ctx.moveTo(42,H);ctx.lineTo(42,H-138);ctx.quadraticCurveTo(W/2,H-192,W-42,H-138);ctx.lineTo(W-42,H);ctx.closePath();ctx.fill();
  waves(80,H-104,880,"rgba(253,248,236,.45)",2);
  palm(62,H-14,.62,false);palm(W-62,H-14,.62,true);
  ctx.restore();
  ribbon(W/2,H-118,520,64,"#FRAMEINGOA");
}

// ── Supabase fetch ────────────────────────────────────────────────────
async function fetchBuilder(id){
  const res=await fetch(
    `${SUPABASE_URL}/rest/v1/builders?id=eq.${encodeURIComponent(id)}&select=*`,
    {headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`}}
  );
  if(!res.ok) throw new Error("fetch failed");
  const rows=await res.json();
  return rows[0]||null;
}

function renderError(msg){
  document.getElementById("root").innerHTML=`
    <div style="text-align:center;font-family:'DM Mono',monospace;letter-spacing:.12em;padding-top:80px;width:100%">
      <div style="font-size:48px;margin-bottom:16px">🤔</div>
      <h2 style="font-family:'Alfa Slab One',serif;font-size:28px;color:var(--sun);margin:0 0 8px">Builder Not Found</h2>
      <p style="font-size:13px;opacity:.7;margin:0 0 24px">${msg}</p>
      <a href="${SITE_URL}" class="cta" style="display:inline-block;margin-top:16px;padding:14px 32px;width:auto">🌴 Make your own</a>
    </div>`;
}

// ── Photo loader (hoisted so logo onload can reuse it) ───────────────
async function loadPhoto(dataURL){
  if(!dataURL) return null;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=dataURL;
  });
}

// ── Main ──────────────────────────────────────────────────────────────
(async()=>{
  const params=new URLSearchParams(location.search);
  let id=params.get("id");
  if(!id){const m=location.pathname.match(/\/v\/(\d+)$/);if(m)id=m[1];}
  if(!id){renderError("No builder ID in the URL.");return;}
  id=String(parseInt(id,10)||0).padStart(3,"0");

  let builder;
  try{
    builder=await fetchBuilder(id);
    if(!builder){renderError("This ID hasn't been registered yet.");return;}
  }catch(e){renderError("Couldn't reach the server. Try again in a moment.");return;}

  // Swap loading state with canvas — NO overlay text, just the clean card
  const root=document.getElementById("root");
  root.innerHTML=`
    <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
      <canvas id="vcv" width="1040" height="1500" style="width:100%;max-width:520px;height:auto;border-radius:20px;display:block;box-shadow:0 14px 0 rgba(0,0,0,.35)"></canvas>
      <div style="width:100%;max-width:520px;padding:18px 24px;background:#1B6B43;border-radius:20px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 rgba(0,0,0,.3)">
        <span style="font-size:28px;line-height:1">✅</span>
        <div>
          <div style="font:700 15px/1 'Space Grotesk',sans-serif;color:#FFC72C;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px">Builder Verified</div>
          <div style="font:500 12px/1.4 'DM Mono',monospace;color:#F7EFD8;opacity:.85;letter-spacing:.06em">This is a genuine HH Goa 2026 Builder ID</div>
        </div>
      </div>
      <a href="${SITE_URL}" class="cta" style="max-width:520px">🌴 Make it yours</a>
      <p style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;opacity:.55;text-align:center;margin:0">
        #FRAMEINGOA · HACKER HOUSE GOA 2026
      </p>
    </div>`;

  cv=document.getElementById("vcv");
  ctx=cv.getContext("2d");

  window._lastBuilder = builder;
  window._lastPhotoDataURL = builder.photo || null;

  document.fonts.ready.then(async()=>{
    const photoImg=await loadPhoto(builder.photo||null);
    drawVerifyID(builder,photoImg);
  });
})();
</script>
